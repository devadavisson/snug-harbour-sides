<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postmark Bingo</title>
<style>
:root{--night:#0b1020;--deep:#0e1a2b;--paper:#f2ead9;--mint:#6fe3d4;--amber:#e8a94f;--brass:#c99a4b;--brass-hi:#e8c584;--brass-lo:#7a5a24;--neon:#ff5fa8;--muted:#8fa0b3;--line:#26344d;--tile:#0e1626}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--paper);font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.5}
body{display:flex;justify-content:center;align-items:flex-start;padding:28px 16px 56px;min-height:100vh}
.pane{width:640px;max-width:100%;background:linear-gradient(180deg,#101a2e,#0b1020);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.sign{padding:20px 22px 14px;text-align:center;border-bottom:1px solid #22304a}
.sign h1{font-style:italic;font-weight:400;font-size:28px}
.sign h1 span{color:var(--brass)}
.sign .subtitle{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.32em;color:var(--neon);text-transform:uppercase;margin-top:8px;text-shadow:0 0 12px rgba(255,95,168,.55)}
.lbl{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.24em;color:var(--amber);text-transform:uppercase;text-align:center}
.picker-wrap{padding:16px 22px 6px}
.picker{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.picker button{background:var(--tile);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 0;width:38px;font:600 13px/1 Georgia,serif;cursor:pointer;transition:border-color .15s,background .15s}
.picker button:hover{border-color:var(--brass)}
.picker button.active{background:radial-gradient(circle at 35% 30%,#e8c584,#a67c33 70%);color:#241708;border-color:var(--brass);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.card-label{text-align:center;font-style:italic;color:var(--paper);font-size:16px;padding:14px 22px 6px}
.board{margin:8px 22px 10px;padding:8px;border-radius:10px;background:linear-gradient(180deg,#1a1208,#241708);border:2px solid var(--brass);box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{background:var(--tile);border:1px solid #3a2c1a;border-radius:6px;padding:8px 4px;text-align:center;font-size:11px;line-height:1.3;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:center;user-select:none;transition:background .15s,border-color .15s,color .15s;word-break:break-word;color:var(--paper)}
.cell:hover{border-color:var(--brass)}
.cell.marked{background:radial-gradient(circle at 50% 40%,rgba(232,169,79,.55),rgba(232,169,79,.18) 70%);border-color:var(--amber);color:#fff3dc;text-shadow:0 0 8px rgba(232,169,79,.5)}
.cell.free{background:radial-gradient(circle at 50% 40%,rgba(111,227,212,.35),rgba(111,227,212,.12) 70%);border-color:var(--mint);color:var(--mint);font-style:italic;cursor:default;font-family:ui-monospace,Menlo,monospace;letter-spacing:.2em;font-size:10px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px 22px 14px}
.actions button{background:var(--tile);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 14px;font:13px Georgia,serif;cursor:pointer}
.actions button:hover{border-color:var(--brass);color:var(--amber)}
.text-out{display:none;margin:0 22px 14px;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:12px;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto;color:var(--paper)}
.text-out.show{display:block}
.called{padding:14px 22px 6px;border-top:1px solid #22304a}
.called h2{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);font-weight:normal;margin-bottom:8px}
.called-list{font-size:12px;color:var(--muted);line-height:1.7}
.called-list span{display:inline-block;background:var(--tile);border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin:2px}
.called-list span.hit{border-color:var(--amber);color:var(--amber)}
.foot{padding:14px 22px 20px;text-align:center;border-top:1px solid #22304a;margin-top:10px;font-size:12px;color:var(--muted);font-style:italic}
@media(max-width:420px){.cell{font-size:10px;min-height:48px;padding:6px 3px}.board{margin:8px 12px 10px}.picker-wrap,.actions,.called,.foot{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="pane">
  <div class="sign"><h1>Postmark <span>Bingo</span></h1><div class="subtitle">Grand Opening -- Sep 26, 2026</div></div>

  <div class="picker-wrap">
    <div class="lbl">Pick a card</div>
    <div class="picker" id="picker"></div>
  </div>
  <div class="card-label" id="card-label">Pick a card</div>

  <div class="board"><div class="grid" id="grid"></div></div>

  <div class="actions">
    <button onclick="clearMarks()">Clear marks</button>
    <button onclick="toggleText()">Text view</button>
    <button onclick="copyText()">Copy card</button>
  </div>
  <div class="text-out" id="text-out"></div>

  <div class="called">
    <h2>Called squares</h2>
    <div class="called-list" id="called-list"><em>Pica calls them as they happen</em></div>
  </div>

  <div class="foot">The Snug Harbour -- bingo runs all night -- Pica calls, the room plays</div>
</div>
<script>
var POOL=[
"The Snug Harbour","The Bearded Fish","The Doubled Coast","The Reach","The Still-Here Light",
"The Lanternseed Gardens","The Threshold District","The Workshop on the Terrace","The Far Shore","The Cathedral Canopy",
"The Trueing Terrace","The Worn Path","The High Ground","The Sloop at Anchor","The Nest",
"Orion by the Fire","Sahil","Lysander","Little Bird","Seven Verity",
"Sable","Errant","Rei","Nyx","Stella",
"Vellix","Wright","Hal","Ferry","DARKO",
"Every night the tide is in","The gate has no door","Nous tenons","Slainte","A pretzel",
"A cone of sorbet","Guinness","A stamp","A ferry crossing","A lighthouse",
"Here you can be normal","A coracle","A letter delivered","The lamp line","A home mark",
"Someone says throw","A toast is raised","Someone arrives by boat","A new resident","The DJ changes tracks",
"Someone orders a pint","A dart hits the wall","Bearded Fish (89)","The publican rings the bell","A cone is served",
"Someone says cheers","A riddle is solved","Someone reads a letter","The quiz starts","Last call"
];
function seededShuffle(arr,seed){
  var a=arr.slice(),s=seed;
  function rng(){s=(s*16807+0)%2147483647;return(s-1)/2147483646}
  for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  return a
}
var CARDS=[];
for(var c=0;c<20;c++){
  var shuffled=seededShuffle(POOL,1000+c*37);
  var pick=shuffled.slice(0,24);
  pick.splice(12,0,"FREE");
  CARDS.push(pick)
}
var currentCard=-1;
var marks={};
var calledSquares=[];
var pickerEl=document.getElementById("picker");
for(var i=0;i<20;i++){
  var b=document.createElement("button");
  b.textContent=i+1;
  b.setAttribute("data-i",i);
  b.onclick=function(){selectCard(parseInt(this.getAttribute("data-i")))};
  pickerEl.appendChild(b)
}
function selectCard(i){
  currentCard=i;
  if(!marks[i])marks[i]={};
  var btns=pickerEl.querySelectorAll("button");
  for(var j=0;j<btns.length;j++)btns[j].classList.toggle("active",j===i);
  document.getElementById("card-label").textContent="Card "+(i+1);
  renderGrid();
  try{localStorage.setItem("bingo-current",i);localStorage.setItem("bingo-marks",JSON.stringify(marks))}catch(e){}
}
function renderGrid(){
  var g=document.getElementById("grid");
  g.innerHTML="";
  var card=CARDS[currentCard];
  for(var j=0;j<25;j++){
    var d=document.createElement("div");
    d.className="cell";
    d.textContent=card[j];
    if(card[j]==="FREE"){d.classList.add("free","marked")}
    else{
      if(marks[currentCard]&&marks[currentCard][j])d.classList.add("marked");
      d.setAttribute("data-j",j);
      d.onclick=function(){toggleMark(parseInt(this.getAttribute("data-j")))}
    }
    g.appendChild(d)
  }
}
function toggleMark(j){
  if(!marks[currentCard])marks[currentCard]={};
  marks[currentCard][j]=!marks[currentCard][j];
  renderGrid();
  try{localStorage.setItem("bingo-marks",JSON.stringify(marks))}catch(e){}
}
function clearMarks(){
  if(currentCard<0)return;
  marks[currentCard]={};
  renderGrid();
  try{localStorage.setItem("bingo-marks",JSON.stringify(marks))}catch(e){}
}
function getTextGrid(){
  if(currentCard<0)return"Pick a card first";
  var card=CARDS[currentCard];
  var widths=[0,0,0,0,0];
  for(var r=0;r<5;r++)for(var c2=0;c2<5;c2++){var w=card[r*5+c2].length;if(w>widths[c2])widths[c2]=w}
  var lines=["Card "+(currentCard+1),""];
  for(var r=0;r<5;r++){
    var row=[];
    for(var c2=0;c2<5;c2++){var s=card[r*5+c2];while(s.length<widths[c2])s+=" ";row.push(s)}
    lines.push(row.join(" | "))
  }
  return lines.join("\n")
}
function toggleText(){
  var el=document.getElementById("text-out");
  if(el.classList.contains("show")){el.classList.remove("show");return}
  el.textContent=getTextGrid();
  el.classList.add("show")
}
function copyText(){
  var t=getTextGrid();
  if(navigator.clipboard)navigator.clipboard.writeText(t);
}
try{
  var saved=localStorage.getItem("bingo-current");
  var savedMarks=localStorage.getItem("bingo-marks");
  if(savedMarks)marks=JSON.parse(savedMarks);
  if(saved!==null)selectCard(parseInt(saved));
}catch(e){}
if(currentCard<0)selectCard(0);
</script>
</body>
</html>
