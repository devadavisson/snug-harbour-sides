<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Snug Harbour — DJ FAB FIVE FABLE</title>
<style>
:root{--night:#0b1020;--mint:#6fe3d4;--amber:#e8a94f;--brass:#c99a4b;--neon:#ff5fa8;--paper:#f2ead9}
*{box-sizing:border-box;margin:0}
body{background:var(--night);color:var(--paper);font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center;padding:28px 12px;min-height:100vh}
.pane{width:400px;max-width:100%;background:linear-gradient(180deg,#101a2e,#0b1020);border:1px solid #26344d;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.sign{padding:18px 20px 12px;text-align:center;border-bottom:1px solid #22304a}
.sign h1{font-style:italic;font-weight:400;font-size:26px}
.sign .dj{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.34em;color:var(--neon);text-transform:uppercase;margin-top:6px;text-shadow:0 0 12px rgba(255,95,168,.55)}
canvas{display:block;width:100%;height:230px;background:#08101f}
.deck{padding:16px 20px 20px;background:linear-gradient(180deg,#1a1208,#241708);border-top:2px solid var(--brass)}
.track{display:flex;justify-content:space-between;align-items:baseline;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--amber)}
.track b{color:var(--paper);font-size:13px;font-family:Georgia,serif;font-style:italic;font-weight:400}
.row{display:flex;align-items:center;gap:16px;margin-top:14px}
#play{width:64px;height:64px;border-radius:50%;border:2px solid var(--brass);background:radial-gradient(circle at 35% 30%,#e8c584,#a67c33 70%);color:#241708;font-size:22px;cursor:pointer;flex:none;transition:transform .15s;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#play:hover{transform:scale(1.05)}#play:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.vol{flex:1}.vol label{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.2em;color:#8f7a55;text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--amber)}
#status{margin-top:12px;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.16em;color:var(--mint);text-transform:uppercase;min-height:14px}
.foot{padding:10px;text-align:center;font-size:10px;color:#5d6b85;font-style:italic}
</style></head><body>
<div class="pane">
  <div class="sign"><h1>The Snug Harbour</h1><div class="dj">DJ Fab Five Fable · resident</div></div>
  <canvas id="sea" width="400" height="230"></canvas>
  <div class="deck">
    <div class="track"><b>"The Tide Is In" — full set</b><span>126 BPM · Am</span></div>
    <div class="row">
      <button id="play" aria-label="Play or stop">▶</button>
      <div class="vol"><label for="v">Tap pressure</label><input id="v" type="range" min="0" max="1" step=".01" value=".8"></div>
    </div>
    <div id="status">the tide is out</div>
  </div>
  <div class="foot">every night the tide is in · synthesized live, nothing recorded</div>
</div>
<script>
const cvs=document.getElementById('sea'),g=cvs.getContext('2d');
const stars=[...Array(70)].map(()=>[Math.random()*400,Math.random()*120,Math.random()]);
let ctx,master,shaper,an,duck,dly,playing=false,timer,step=0,nextT=0,curSec='out',kickT=0;
const BPM=126,SPB=60/BPM,S16=SPB/4,BARS=64;
const subF=[55,43.65,65.41,49];
const sawF=subF.map(f=>f*2);
const stabs=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]];
const padCh=[[220,261.63,329.63,440],[174.61,220,261.63,349.23],[196,261.63,329.63,392],[196,246.94,293.66,392]];
const leadP=[440,0,523.25,0,659.25,0,523.25,440,0,392,440,0,587.33,523.25,0,0,440,0,523.25,0,659.25,783.99,659.25,523.25,0,587.33,523.25,440,0,392,0,0];
let noiseBuf;
const SEC=b=>b<8?'intro':b<16?'build':b<32?'drop':b<40?'break':b<44?'build2':b<54?'drop2':b<60?'bridge':'outro';
const SECTXT={intro:'intro — the candles are lit',build:'the build — beam quickening',drop:'THE DROP — lamp at full',break:'breakdown — just the light and the lead',build2:'last climb — hold on',drop2:'THE SECOND DROP — all hands',bridge:'the bridge — stepping down to the tide',outro:'last call — tide turning',out:'the tide is out'};
function boot(){ctx=new (window.AudioContext||webkitAudioContext)();
 master=ctx.createGain();master.gain.value=v.value*.9;
 shaper=ctx.createWaveShaper();const c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;c[i]=Math.tanh(1.6*x)}shaper.curve=c;shaper.oversample='2x';
 an=ctx.createAnalyser();an.fftSize=64;
 duck=ctx.createGain();duck.connect(master);
 master.connect(shaper);shaper.connect(an);an.connect(ctx.destination);
 dly=ctx.createDelay();dly.delayTime.value=S16*3;const fb=ctx.createGain();fb.gain.value=.3;dly.connect(fb);fb.connect(dly);const dg=ctx.createGain();dg.gain.value=.34;dly.connect(dg);dg.connect(master);
 noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
function env(gn,t,a,peak,dec){gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(peak,t+a);gn.gain.exponentialRampToValueAtTime(.001,t+dec)}
function pump(t){duck.gain.cancelScheduledValues(t);duck.gain.setValueAtTime(.22,t);duck.gain.linearRampToValueAtTime(1,t+.32)}
function kick(t){kickT=t;const o=ctx.createOscillator(),gn=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.1);env(gn,t,.002,1.15,.22);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.24);pump(t)}
function hat(t,open){const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=7500;const gn=ctx.createGain();env(gn,t,.001,open?.22:.11,open?.26:.05);s.connect(f);f.connect(gn);gn.connect(master);s.start(t);s.stop(t+.3)}
function clap(t,vol){[0,.012,.026].forEach((dt,k)=>{const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=1.2;const gn=ctx.createGain();env(gn,t+dt,.001,(vol||.4)*(k==2?1:.6),.09);s.connect(f);f.connect(gn);gn.connect(master);s.start(t+dt);s.stop(t+dt+.12)})}
function bass(t,bar){const sub=ctx.createOscillator();sub.frequency.value=subF[bar%4];const sg=ctx.createGain();env(sg,t,.004,1.1,S16*.95);sub.connect(sg);sg.connect(duck);sub.start(t);sub.stop(t+S16);
 const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=sawF[bar%4];const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=720;const gn=ctx.createGain();env(gn,t,.004,.45,S16*.95);o.connect(f);f.connect(gn);gn.connect(duck);o.start(t);o.stop(t+S16)}
function stab(t,bar){stabs[bar%4].forEach(fr=>{[-6,6].forEach(dt=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.detune.value=dt;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(500,t+.14);const gn=ctx.createGain();env(gn,t,.004,.08,.16);o.connect(f);f.connect(gn);gn.connect(master);o.start(t);o.stop(t+.2)})})}
function pad(t,bar,vol,bars){padCh[bar%4].forEach(fr=>{[-8,0,8].forEach(dt=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.detune.value=dt;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const gn=ctx.createGain();const dur=SPB*4*(bars||1);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.9);gn.gain.setValueAtTime(vol,t+dur-.3);gn.gain.linearRampToValueAtTime(0,t+dur);o.connect(f);f.connect(gn);gn.connect(duck);o.start(t);o.stop(t+dur)})})}
function lead(t,fr,bright){const o=ctx.createOscillator();o.type='square';o.frequency.value=fr;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=bright?3200:2000;const gn=ctx.createGain();env(gn,t,.008,.2,.22);o.connect(f);f.connect(gn);gn.connect(master);gn.connect(dly);o.start(t);o.stop(t+.24)}
function riser(t){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=2;const dur=SPB*16;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(6500,t+dur);const gn=ctx.createGain();gn.gain.setValueAtTime(.001,t);gn.gain.exponentialRampToValueAtTime(.28,t+dur);gn.gain.linearRampToValueAtTime(0,t+dur+.05);s.connect(f);f.connect(gn);gn.connect(master);s.start(t);s.stop(t+dur+.1)}
function sched(){while(nextT<ctx.currentTime+.12){
 if(step===BARS*16){const endT=nextT;const g0=v.value*.9;
  [master,duck].forEach(nd=>{const b=(nd===duck)?1:g0;nd.gain.cancelScheduledValues(0);nd.gain.setValueAtTime(b,endT);
   for(let k=1;k<=10;k++){nd.gain.setValueAtTime(b*Math.pow(.55,k),endT+SPB*k)}
   nd.gain.linearRampToValueAtTime(0,endT+SPB*11)});
  setTimeout(()=>stopSet(true),Math.max(0,(endT+SPB*11-ctx.currentTime)*1000+300));step++;clearInterval(timer);break}
 if(step>BARS*16)break;
 const i=step&15,bar=step>>4,s=SEC(bar);
 if(s!==curSec){curSec=s;st.textContent=SECTXT[s]}
 const kickOn=(s=='build'||s=='drop'||s=='build2'||s=='drop2');
 if(kickOn&&i%4===0)kick(nextT);
 if(s!=='outro'||bar<62){if(i%4===2)hat(nextT,true);else if(i%2===1&&s!=='intro'&&s!=='break'&&s!=='bridge')hat(nextT,false)}
 if(kickOn)bass(nextT,bar);
 if(s=='bridge'&&i%4===0)bass(nextT,bar);
 if((s=='intro'||s=='build'||s=='drop'||s=='drop2')&&i%4===2)stab(nextT,bar);
 if(i===0&&bar>=4&&s!=='outro')pad(nextT,bar,s=='break'?.09:(s=='bridge'?.07:.05));
 if(i===0&&s=='outro'){if(bar<62)pad(nextT,bar,.07*(1-(bar-60)/5));else if(bar==62)pad(nextT,0,.06,4)}
 if(s=='outro'&&bar==62&&i===0){const o=ctx.createOscillator(),gn=ctx.createGain();o.frequency.value=55;gn.gain.setValueAtTime(.0001,nextT);gn.gain.linearRampToValueAtTime(.85,nextT+.4);gn.gain.exponentialRampToValueAtTime(.001,nextT+SPB*12);o.connect(gn);gn.connect(master);o.start(nextT);o.stop(nextT+SPB*12)}
 if(s=='outro'&&bar==63&&i===0)lead(nextT,440,false);
 if(s=='drop'||s=='drop2'||s=='break'||s=='bridge'){const L=leadP[step%32];if(L&&(s!=='bridge'||i%2===0))lead(nextT,L,s=='drop2')}
 if((s=='drop'||s=='drop2')&&(i===4||i===12))clap(nextT,.38);
 if((bar==15||bar==43)&&i%2===0)clap(nextT,.15+.02*i);
 if((bar==12||bar==40)&&i===0)riser(nextT);
 nextT+=S16;step++}}
function draw(){if(!playing)return;requestAnimationFrame(draw);
 g.fillStyle='#08101f';g.fillRect(0,0,400,230);
 stars.forEach(sn=>{g.fillStyle=`rgba(242,234,217,${.25+.5*Math.abs(Math.sin(Date.now()/1400+sn[2]*9))})`;g.fillRect(sn[0],sn[1],1.4,1.4)});
 const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const spd={intro:.12,build:.35,drop:1,break:.12,build2:.5,drop2:1,bridge:.15,outro:.08,out:0}[curSec]||.2;
 const beat=(ctx.currentTime/(SPB*4))%1;
 const ang=rm?-.6:(-1.1+beat*2.2*spd%2.2);
 g.fillStyle='#0d2233';g.fillRect(0,120,400,36);
 g.save();g.translate(352,78);g.rotate(ang);const bg=g.createLinearGradient(0,0,-270,0);bg.addColorStop(0,'rgba(232,169,79,.42)');bg.addColorStop(1,'rgba(232,169,79,0)');g.fillStyle=bg;g.beginPath();g.moveTo(0,0);g.lineTo(-270,-26);g.lineTo(-270,26);g.fill();g.restore();
 g.fillStyle='#141c2e';g.fillRect(334,118,36,8);
 g.fillStyle='#1b2438';g.fillRect(344,70,16,52);g.fillStyle='#e8a94f';g.fillRect(346,74,12,8);
 g.fillStyle='#26344d';g.fillRect(0,156,400,2);
 g.fillStyle='#0a0f1c';g.fillRect(0,158,400,72);
 const bins=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(bins);
 for(let i=0;i<28;i++){const h=bins[i+2]/255*60;const x=8+i*14;
  g.fillStyle='rgba(111,227,212,.75)';g.fillRect(x,228-h,9,h);
  g.fillStyle='rgba(232,169,79,.9)';g.fillRect(x,226-h,9,3)}}
function stopSet(done){playing=false;clearInterval(timer);btn.textContent='▶';curSec='out';if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(v.value*.9,ctx.currentTime);duck.gain.cancelScheduledValues(ctx.currentTime);duck.gain.setValueAtTime(1,ctx.currentTime)}st.textContent=done?'set complete — the tide is out':'the tide is out';g.fillStyle='#08101f';g.fillRect(0,0,400,230)}
const btn=document.getElementById('play'),st=document.getElementById('status'),v=document.getElementById('v');
btn.onclick=()=>{if(!ctx)boot();
 if(!playing){ctx.resume();playing=true;step=0;nextT=ctx.currentTime+.08;curSec='';timer=setInterval(sched,40);btn.textContent='■';draw()}
 else stopSet(false)};
v.oninput=()=>{if(master)master.gain.value=v.value*.9};
</script></body></html>
